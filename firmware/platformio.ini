; Hydro Node - Section 1 firmware (sensor acquisition & connection detection)
;
; Target: Arduino Pro Mini 3.3 V / 8 MHz (ATmega328P). The on-board regulator is
; bypassed and VCC is fed directly from the 3.6 V battery pack; the module's
; ground is the switched ground downstream of Q1. See docs/HARDWARE.md.
;
;   pio run                 build
;   pio run -t upload       flash through the J? programming header (3.3 V FTDI)
;   pio device monitor      read the serial report
;
; The host logic tests are driven by the Makefile, not by `pio test`:
;
;   make test
;
; No external libraries. The 1-Wire master and the DS18B20 driver are part of
; this firmware because the fault detection Section 1 exists to provide lives in
; the details a general-purpose library hides.

[env:hydro_node]
platform      = atmelavr
board         = pro8MHzatmega328
framework     = arduino

monitor_speed = 9600
upload_speed  = 57600

; Applied to this firmware only, so the Arduino core's own warnings do not bury
; ours. Our code is expected to build clean.
build_src_flags =
    -Wall
    -Wextra
    -Wshadow

build_flags =
    -ffunction-sections
    -fdata-sections
