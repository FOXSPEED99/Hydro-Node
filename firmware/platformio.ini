; Hydro Node - Section 1 firmware (sensor acquisition & connection detection)
;
; The primary build is the ARDUINO IDE - open HydroNode/HydroNode.ino, set
; Tools > Board to "Arduino Pro or Pro Mini" and Tools > Processor to
; "ATmega328P (3.3V, 8 MHz)". See README.md.
;
; This file is here so the same sources also build under PlatformIO, which is
; useful for CI and for anyone who prefers it. src_dir points at the sketch
; folder so there is exactly one copy of the code - nothing to keep in sync.
;
;   pio run                 build
;   pio run -t upload       flash through the J? programming header (3.3 V FTDI)
;   pio device monitor      read the serial report
;
; The host logic tests are driven by the Makefile, not by `pio test`:
;
;   make test
;
; No external libraries. The 1-Wire master and the DS18B20 driver are part of
; this firmware because the fault detection Section 1 exists to provide lives in
; the details a general-purpose library hides.

[platformio]
src_dir = HydroNode

[env:hydro_node]
platform      = atmelavr
board         = pro8MHzatmega328
framework     = arduino

monitor_speed = 9600
upload_speed  = 57600

; Applied to this firmware only, so the Arduino core's own warnings do not bury
; ours. Our code is expected to build clean.
build_src_flags =
    -Wall
    -Wextra
    -Wshadow

build_flags =
    -ffunction-sections
    -fdata-sections
